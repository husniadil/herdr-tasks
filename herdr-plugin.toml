id = "herdr-tasks"
name = "Tasks"
version = "0.7.0"
min_herdr_version = "0.8.0"
description = "A task backlog and notes board for agents: claims with leases, evidence, review, and ideas a human promotes or drops"
platforms = ["macos", "linux"]

# One statically linked Go binary is the daemon, the CLI and the MCP server.
# Compiling on install keeps the repository free of release artefacts, and Go's
# build cache makes the second install fast.
[[build]]
id = "binary"
command = ["go", "build", "-o", "./bin/htask", "./cmd/htask"]

# Starts the daemon and exits, which is what Herdr expects of a startup
# command. The daemon detaches, so it survives the pane that opened it.
[[startup]]
id = "daemon"
command = ["./scripts/start.sh"]

# Herdr has no shutdown hook, so disabling or unlinking the plugin leaves the
# daemon running. This is the way to actually turn it off.
[[actions]]
id = "stop"
title = "Stop the tasks daemon"
contexts = ["workspace"]
command = ["./scripts/stop.sh"]

[[actions]]
id = "restart"
title = "Restart the tasks daemon"
contexts = ["workspace"]
command = ["./scripts/restart.sh"]

# One action per popup, because Herdr binds keys to actions and not to panes:
# without these there is no keyboard route to the board at all. The ids match
# the [[panes]] ids below, which is what keybindings.toml relies on to name
# them as herdr-tasks.board and herdr-tasks.notes.
[[actions]]
id = "board"
title = "Open the tasks board"
contexts = ["workspace"]
command = ["./scripts/open-pane.sh", "board"]

[[actions]]
id = "notes"
title = "Open the notes board"
contexts = ["workspace"]
command = ["./scripts/open-pane.sh", "notes"]

# The same pass the daemon runs on its timer, on demand. It frees leases that
# have LAPSED; a pane that died a moment ago keeps its claim until its lease
# runs out. To free that one now, run `htask sweep --pane <pane id>`.
[[actions]]
id = "sweep"
title = "Release lapsed leases now"
contexts = ["workspace"]
command = ["./bin/htask", "sweep"]

# A pane that dies should give its work back at once, not when the lease runs
# out. Both events, because they are different deaths: `pane.exited` is the
# command finishing while the pane stays, `pane.closed` is the pane going away.
# Herdr spells hook names with dots here, though the event schema enums spell
# them with underscores — see docs/contract-notes.md §8.4.
#
# The script reads HERDR_PANE_ID from the environment: Herdr substitutes
# nothing into an argv, so a "$HERDR_PANE_ID" written here would arrive as
# that literal string.
[[events]]
on = "pane.closed"
command = ["./scripts/on-pane-gone.sh"]

[[events]]
on = "pane.exited"
command = ["./scripts/on-pane-gone.sh"]

# The human surface (§11.6, §1.3). The board is transient — open it, act on
# what is in review, close it — so it is a popup. A popup gets no
# HERDR_PANE_ID, which makes the operator's board `human` (§3.2), and human is
# exactly the principal the only verbs it offers belong to.
[[panes]]
id = "board"
title = "Tasks board"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/htask", "tui", "board"]

[[panes]]
id = "notes"
title = "Notes and parked actions"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/htask", "tui", "notes"]
